name: Sync Today's Song

on:
  schedule:
    # 매일 자정(한국 시간) 실행. cron은 UTC 기준이라 15:00 UTC = 00:00 KST.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      # 추천찬양 재생목록에서 아직 등록되지 않은 곡을 가져온다.
      # 좋아요 목록으로 되돌리려면 ?source=recommended 를 지우면 된다.
      - name: Call /api/cron/sync-song
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-song?source=recommended")
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            exit 1
          fi
